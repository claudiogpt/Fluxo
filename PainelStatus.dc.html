<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tema.css">
<script src="./support.js"></script>
</head>
<body>
<!-- Painel de status do jogo: cabeçalho (mês, tempo, sparkline, patrimônio),
     4 cards de indicadores e barra de progresso rumo à independência.
     Só template: renderiza direto contra as props. -->
<x-dc>
<div style="color:#d7e1ea;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;">

  <div style="display:flex;align-items:center;gap:20px;border-bottom:1px solid #1e2833;padding-bottom:14px;margin-bottom:16px;flex-wrap:wrap;">
    <div style="font-weight:700;letter-spacing:1px;color:#f2f7fb;">FALÊNCIA <span style="color:#3a4a5a;">ou</span> <span style="color:#22d47e;">LIBERDADE</span></div>
    <div style="color:#8fa1b2;">MÊS <span style="color:#f2f7fb;font-weight:600;">{{ mesFmt }}</span></div>
    <div style="color:#8fa1b2;">⏱ <span style="color:{{ tempoCor }};font-weight:600;">{{ tempoFmt }}</span></div>
    <svg width="180" height="34" viewBox="0 0 180 34" style="display:block;">
      <polyline points="{{ sparkPoints }}" fill="none" stroke="{{ sparkCor }}" stroke-width="1.5"></polyline>
    </svg>
    <div style="margin-left:auto;text-align:right;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">PATRIMÔNIO TOTAL</div>
      <div style="font-size:20px;font-weight:700;color:#f2f7fb;">{{ patrimonioFmt }}</div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;">
    <div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:12px 14px;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">SALDO EM CAIXA</div>
      <div style="font-size:18px;font-weight:700;color:{{ caixaCor }};">{{ caixaFmt }}</div>
    </div>
    <div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:12px 14px;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">SALÁRIO / MÊS</div>
      <div style="font-size:18px;font-weight:700;color:{{ salarioCor }};">{{ salarioStatus }}</div>
    </div>
    <div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:12px 14px;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">CUSTO DE VIDA / MÊS</div>
      <div style="font-size:18px;font-weight:700;color:#ff4d5e;">−{{ custoFmt }}</div>
    </div>
    <div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:12px 14px;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">RENDA PASSIVA / MÊS</div>
      <div style="font-size:18px;font-weight:700;color:#22d47e;">+{{ rpFmt }}</div>
    </div>
  </div>

  <div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:12px 14px;margin-bottom:16px;">
    <div style="display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#6b7c8c;margin-bottom:8px;">
      <span>RUMO À INDEPENDÊNCIA — renda passiva vs. custo de vida</span>
      <span style="color:{{ progCor }};font-weight:600;">{{ progFmt }}</span>
    </div>
    <div style="height:8px;background:#0b0f14;border-radius:4px;overflow:hidden;">
      <div style="height:100%;width:{{ progPct }}%;background:{{ progCor }};transition:width .5s ease;"></div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mesFmt":{"default":"07"},"tempoFmt":{"default":"03:12"},"tempoCor":{"default":"#f2f7fb"},"sparkPoints":{"default":"2,28 46,24 90,25 134,16 178,6"},"sparkCor":{"default":"#22d47e"},"patrimonioFmt":{"default":"R$ 21.300"},"caixaFmt":{"default":"R$ 4.150"},"caixaCor":{"default":"#f2f7fb"},"salarioStatus":{"default":"+R$ 4.500"},"salarioCor":{"default":"#8fd47e"},"custoFmt":{"default":"R$ 3.290"},"rpFmt":{"default":"R$ 410"},"progPct":{"default":"12.5"},"progFmt":{"default":"12.5%"},"progCor":{"default":"#ff9d4b"}}'></script>
</body>
</html>
