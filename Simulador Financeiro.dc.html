<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<!-- Engine do jogo (funções puras, sem UI) — ordem segue as dependências entre módulos -->
<script src="./engine/config.js"></script>
<script src="./engine/ativos.js"></script>
<script src="./engine/formato.js"></script>
<script src="./engine/eventos.js"></script>
<script src="./engine/placar.js"></script>
<script src="./engine/conceitos.js"></script>
<script src="./engine/regras.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tema.css">
</helmet>

<div data-screen-label="Simulador" style="min-height:100vh;background:#0b0f14;color:#d7e1ea;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;">

  <sc-if value="{{ mostraIntro }}" hint-placeholder-val="{{ true }}">
    <dc-import name="Intro" comecar="{{ comecar }}" caixaFmt="{{ caixaFmt }}" salarioFmt="{{ salarioFmt }}" custoFmt="{{ custoFmt }}"
      modosLista="{{ modosLista }}"
      escolherNormal="{{ escolherNormal }}" escolherHardcore="{{ escolherHardcore }}"
      normalBg="{{ normalBg }}" normalCor="{{ normalCor }}" hardBg="{{ hardBg }}" hardCor="{{ hardCor }}"
      difDica="{{ difDica }}"
      mostraCapitais="{{ mostraCapitais }}" capitaisLista="{{ capitaisLista }}"
      mostraCenarios="{{ mostraCenarios }}" cenariosLista="{{ cenariosLista }}"
      mostraSaqueConfig="{{ mostraSaqueConfig }}" saqueDica="{{ saqueDica }}"
      fixoBg="{{ fixoBg }}" fixoCor="{{ fixoCor }}" pctBg="{{ pctBg }}" pctCor="{{ pctCor }}"
      escolherSaqueFixo="{{ escolherSaqueFixo }}" escolherSaquePct="{{ escolherSaquePct }}"
      mostraEstrategia="{{ mostraEstrategia }}" estrategiaDica="{{ estrategiaDica }}"
      comprarBg="{{ comprarBg }}" comprarCor="{{ comprarCor }}" alugarBg="{{ alugarBg }}" alugarCor="{{ alugarCor }}"
      escolherComprar="{{ escolherComprar }}" escolherAlugar="{{ escolherAlugar }}"
      nick="{{ nick }}" setNick="{{ setNick }}" nickDica="{{ nickDica }}"
      rendaResumo="{{ rendaResumo }}"></dc-import>
  </sc-if>

  <sc-if value="{{ mostraJogo }}" hint-placeholder-val="{{ false }}">
    <div data-screen-label="Jogo" style="max-width:1280px;margin:0 auto;padding:20px 24px 32px;">

      <dc-import name="PainelStatus"
        mesFmt="{{ mesFmt }}" tempoFmt="{{ tempoFmt }}" tempoCor="{{ tempoCor }}"
        sparkPoints="{{ sparkPoints }}" sparkCor="{{ sparkCor }}" patrimonioFmt="{{ patrimonioFmt }}"
        caixaFmt="{{ caixaFmt }}" caixaCor="{{ caixaCor }}"
        salarioStatus="{{ salarioStatus }}" salarioCor="{{ salarioCor }}" salarioLabel="{{ salarioLabel }}"
        custoFmt="{{ custoFmt }}" rpFmt="{{ rpFmt }}"
        progPct="{{ progPct }}" progFmt="{{ progFmt }}" progCor="{{ progCor }}" progLabel="{{ progLabel }}"
        voltarMenu="{{ voltarMenu }}" modoTag="{{ modoTag }}"></dc-import>

      <div style="display:grid;grid-template-columns:1fr 340px;gap:16px;align-items:start;">

        <div style="display:grid;gap:10px;">
          <sc-if value="{{ mostraNegocio }}" hint-placeholder-val="{{ false }}">
            <dc-import name="NegocioCard" dcProps="{{ negocioCard }}"></dc-import>
          </sc-if>
          <sc-if value="{{ mostraImovel }}" hint-placeholder-val="{{ false }}">
            <dc-import name="ImovelCard" dcProps="{{ imovelCard }}"></dc-import>
          </sc-if>
          <sc-for list="{{ ativosLista }}" as="a" hint-placeholder-count="5">
            <dc-import name="AtivoCard" dcProps="{{ a }}"></dc-import>
          </sc-for>

          <div style="display:flex;gap:8px;margin-top:4px;">
            <button onClick="{{ fecharMes }}" style="flex:1;background:#22d47e;color:#08110c;border:none;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:16px;letter-spacing:2px;padding:16px;border-radius:5px;cursor:pointer;" style-hover="background:#3ee996;">FECHAR O MÊS ▸</button>
            <sc-if value="{{ ehSandbox }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ reiniciar }}" style="width:150px;background:transparent;color:#6b7c8c;border:1px solid #3a4a5a;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:1px;padding:16px 0;border-radius:5px;cursor:pointer;" style-hover="color:#d7e1ea;border-color:#6b7c8c;">↺ RESETAR</button>
            </sc-if>
            <button onClick="{{ toggleAuto }}" style="width:150px;background:{{ autoBg }};color:{{ autoCor }};border:1px solid {{ autoCor }};font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;letter-spacing:1px;padding:16px 0;border-radius:5px;cursor:pointer;">{{ autoLabel }}</button>
          </div>
          <div style="color:#3a4a5a;font-size:10.5px;text-align:center;">[ESPAÇO] fecha o mês · [A] liga/desliga o auto — roda direto até o fim da simulação</div>
        </div>

        <div style="display:grid;gap:12px;">
          <dc-import name="TerminalEventos" logLista="{{ logLista }}"></dc-import>
          <dc-import name="Leaderboard" lbLista="{{ lbLista }}" lbTitulo="{{ lbTitulo }}" lbTituloCor="{{ lbTituloCor }}"></dc-import>
        </div>
      </div>
    </div>
  </sc-if>

  <div style="position:fixed;right:16px;bottom:16px;z-index:70;">
    <button onClick="{{ toggleGlossario }}" style="background:#0d1117;border:1px solid #1e2833;color:#8fa1b2;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.5px;padding:8px 14px;border-radius:20px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5);" style-hover="border-color:#22d47e;color:#22d47e;">📖 {{ glossarioContador }} [G]</button>
  </div>

  <sc-if value="{{ mostraGlossario }}" hint-placeholder-val="{{ false }}">
    <dc-import name="Glossario" contador="{{ glossarioContador }}" lista="{{ glossarioLista }}" fechar="{{ toggleGlossario }}"></dc-import>
  </sc-if>

  <sc-if value="{{ mostraModal }}" hint-placeholder-val="{{ false }}">
    <dc-import name="ConceitoModal" dcProps="{{ modalConceito }}"></dc-import>
  </sc-if>

  <sc-if value="{{ mostraFim }}" hint-placeholder-val="{{ false }}">
    <dc-import name="FimDeJogo" mesFmt="{{ mesFmt }}" tempoFmt="{{ tempoFmt }}" fimTitulo="{{ fimTitulo }}" fimCor="{{ fimCor }}" fimResumo="{{ fimResumo }}" fimLicao="{{ fimLicao }}" reiniciar="{{ reiniciar }}" voltarMenu="{{ voltarMenu }}"></dc-import>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dificuldade&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;hardcore&quot;],&quot;default&quot;:&quot;hardcore&quot;,&quot;tsType&quot;:&quot;'normal'|'hardcore'&quot;,&quot;section&quot;:&quot;Jogo&quot;},&quot;salarioInicial&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4500,&quot;min&quot;:2000,&quot;max&quot;:15000,&quot;step&quot;:500,&quot;unit&quot;:&quot;R$&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Jogo&quot;}}">
// Orquestrador do jogo: guarda o estado, escuta teclado/timer e delega as
// regras ao engine (window.Fluxo.*). Zero regra de negócio aqui.
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // nick e lbRemoto vivem fora do estado de partida: sobrevivem a reset/menu.
    this.state = { ...Fluxo.regras.novoJogo(props), nick: Fluxo.placar.nick(), lbRemoto: null };
  }

  componentDidMount() {
    this.onKey = (e) => {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; // digitando o nick
      if (e.code === 'KeyG') { e.preventDefault(); this.toggleGlossario(); return; }
      if (this.state.glossarioAberto) {
        if (e.code === 'Escape') { e.preventDefault(); this.toggleGlossario(); }
        return;
      }
      if (this.state.modal) {
        if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); this.confirmarModal(); }
        return;
      }
      if (this.state.tela !== 'jogo' || this.state.fim) return;
      if (e.code === 'Space') { e.preventDefault(); this.fecharMes(); }
      if (e.code === 'KeyA') { e.preventDefault(); this.toggleAuto(); }
    };
    window.addEventListener('keydown', this.onKey);
    this.carregarPlacar();
    this.tick = setInterval(() => {
      const st = this.state;
      if (st.tela === 'jogo' && !st.fim && st.inicioTs) {
        this.setState({ agora: Date.now() });
        if (st.auto) this.fecharMes();
      }
    }, 500);
  }

  componentWillUnmount() {
    window.removeEventListener('keydown', this.onKey);
    clearInterval(this.tick);
  }

  toggleAuto = () => this.setState(s => ({ auto: !s.auto }));
  toggleGlossario = () => this.setState(s => ({ glossarioAberto: !s.glossarioAberto }));

  setNick = (e) => {
    const v = String((e && e.target && e.target.value) || '').toUpperCase().slice(0, 16);
    Fluxo.placar.salvarNick(v);
    this.setState({ nick: v });
  };

  // Busca o top 10 global do board atual; sem chaves/rede o placar local assume.
  carregarPlacar = () => {
    if (!Fluxo.placar.online()) return;
    const board = Fluxo.placar.boardDe(this.state);
    Fluxo.placar.lerRemoto(board).then(lista => {
      if (lista) this.setState({ lbRemoto: { board, lista } });
    });
  };

  // Toda partida pontua: salva local e envia pro global (fire-and-forget).
  registrarPlacar(s, resultado) {
    const rec = Fluxo.placar.registro(s, Fluxo.regras.patrimonio(s), s.nick || 'ANÔNIMO', resultado);
    Fluxo.placar.salvar(rec);
    Fluxo.placar.enviarRemoto(rec).then(ok => { if (ok) this.carregarPlacar(); });
  }

  comecar = () => {
    const inicia = () => this.setState({ tela: 'jogo', inicioTs: Date.now(), agora: Date.now() });
    // Cenário imóveis: o conceito de custo de oportunidade vem ANTES da decisão.
    if (this.state.imoveis) return this.executarComConceito('moradia', inicia);
    inicia();
  };

  // Mostra o modal do conceito na 1ª vez; depois disso, executa direto.
  // `acao` null = modal informativo (sem cancelar). Abrir modal pausa o AUTO.
  executarComConceito(id, acao) {
    if (Fluxo.conceitos.jaVisto(id)) { if (acao) acao(); return; }
    this.modalAcao = acao || null;
    this.setState({ modal: { id, temAcao: !!acao }, auto: false });
  }
  confirmarModal = () => {
    const m = this.state.modal;
    if (!m) return;
    Fluxo.conceitos.marcarVisto(m.id);
    const acao = this.modalAcao;
    this.modalAcao = null;
    this.setState({ modal: null }, () => { if (acao) acao(); });
  };
  cancelarModal = () => {
    this.modalAcao = null;
    this.setState({ modal: null });
  };

  // Gatilhos que dependem do estado (não de um clique): 1 modal por vez;
  // condições persistentes disparam no turno seguinte se houver fila.
  verificarConceitosDeEstado() {
    const s = this.state;
    if (s.modal || s.fim) return;
    const nClasses = Fluxo.ativos.filter(d => s.ativos[d.key] >= 1).length;
    if (nClasses >= 3 && !Fluxo.conceitos.jaVisto('diversificacao')) return this.executarComConceito('diversificacao', null);
    if (s.aposentadoria && s.aposentadoria.fase === 'saque' && !Fluxo.conceitos.jaVisto('sequencia')) return this.executarComConceito('sequencia', null);
    if (s.liquidacaoNoMes && !Fluxo.conceitos.jaVisto('liquidacaoForcada')) return this.executarComConceito('liquidacaoForcada', null);
  }

  // Recria o estado preservando as escolhas do menu (dificuldade, modo e capital).
  novoEstado(s, extras) {
    return {
      ...Fluxo.regras.novoJogo({
        ...this.props,
        dificuldade: s.dificuldade,
        modo: s.modo,
        capitalInicial: s.modo === 'sandbox' ? s.capitalInicial : null,
        cenario: s.cenario,
        saqueModo: s.aposentadoria ? s.aposentadoria.saqueModo : undefined,
        imoveisEscolha: s.imoveis ? s.imoveis.escolha : undefined,
      }),
      modal: null,
      nick: s.nick,
      lbRemoto: s.lbRemoto,
      ...extras,
    };
  }
  reiniciar = () => this.setState(s => this.novoEstado(s, { tela: 'jogo', inicioTs: Date.now(), agora: Date.now() }));
  voltarMenu = () => this.setState(s => this.novoEstado(s, {}));
  escolherDificuldade(d) {
    this.setState(s => this.novoEstado({ ...s, dificuldade: d }, {}));
  }
  escolherModo(id) {
    this.setState(s => this.novoEstado({ ...s, modo: id }, {}), () => this.carregarPlacar());
  }
  escolherCapital(v) {
    this.setState(s => this.novoEstado({ ...s, capitalInicial: v }, {}));
  }
  escolherCenario(id) {
    this.setState(s => this.novoEstado({ ...s, cenario: id }, {}), () => this.carregarPlacar());
  }
  escolherSaqueModo(m) {
    this.setState(s => this.novoEstado({ ...s, cenario: s.cenario, aposentadoria: { ...s.aposentadoria, saqueModo: m } }, {}));
  }
  escolherEstrategia(e) {
    this.setState(s => this.novoEstado({ ...s, imoveis: { ...s.imoveis, escolha: e } }, {}));
  }

  mover(key, valor) {
    const aplica = () => this.setState(s => Fluxo.regras.mover(s, key, valor), () => this.verificarConceitosDeEstado());
    // 1º aporte em classes com conceito próprio pede o "entendi" antes.
    if (valor > 0 && (key === 'reserva' || key === 'acoes' || key === 'cripto')) {
      return this.executarComConceito(key, aplica);
    }
    aplica();
  }

  aportarNegocio(v) { this.setState(s => Fluxo.regras.aportarNegocio(s, v)); }
  sacarNegocio(v) { this.setState(s => Fluxo.regras.sacarNegocio(s, v)); }
  reinvestirNegocio = () => this.setState(s => Fluxo.regras.reinvestirNegocio(s));

  fecharMes = () => {
    this.setState(st => {
      if (st.fim) return st; // partida encerrada: nada mais a fechar
      const s = Fluxo.regras.fecharMes(st);
      // Todo desfecho pontua no board do modo; o sandbox (que nunca termina)
      // pontua na hora em que a renda passiva cruza o custo de vida.
      if (s.fim && !st.fim) this.registrarPlacar(s);
      else if (s.marcoLivre && !st.marcoLivre) this.registrarPlacar(s, 'marco');
      return s;
    }, () => this.verificarConceitosDeEstado());
  };

  // View-model: converte o estado do engine em strings/cores prontas pros templates.
  renderVals() {
    const { fmt, fmtCompacto, fmtTempo, sparkline } = Fluxo.formato;
    const s = this.state;
    const rp = Fluxo.regras.rendaPassiva(s);
    const pat = Fluxo.regras.patrimonio(s);
    const prog = Math.min(100, (rp / s.custo) * 100);

    const ativosLista = Fluxo.ativos.map(d => {
      const v = s.ativos[d.key];
      const r = s.varMes[d.key] || 0;
      return {
        key: d.key, nome: d.nome, ticker: d.ticker, dica: d.dica,
        riscoLabel: d.risco, riscoCor: d.riscoCor,
        valorFmt: fmt(v),
        varFmt: v < 1 ? '—' : (r >= 0 ? '▲ +' : '▼ ') + (r * 100).toFixed(1) + '% no mês',
        varCor: v < 1 ? '#3a4a5a' : (r >= 0 ? '#22d47e' : '#ff4d5e'),
        mais500: () => this.mover(d.key, 500),
        mais1k: () => this.mover(d.key, 1000),
        mais2k: () => this.mover(d.key, 2000),
        tudo: () => this.mover(d.key, s.caixa),
        menos500: () => this.mover(d.key, -500),
        menos1k: () => this.mover(d.key, -1000),
        menos2k: () => this.mover(d.key, -2000),
        zerar: () => this.mover(d.key, -s.ativos[d.key]),
      };
    });

    const spark = sparkline(s.hist.length ? s.hist : [pat]);

    // Placar do board atual: global (Supabase) quando carregou, senão o local.
    const board = Fluxo.placar.boardDe(s);
    const remoto = s.lbRemoto && s.lbRemoto.board === board ? s.lbRemoto.lista : null;
    const LB_ROTULOS = {
      livre: ['LIVRE', '#22d47e'], marco: ['LIVRE', '#22d47e'],
      apos_sucesso: ['VIVEU', '#22d47e'], apos_faliu: ['ZEROU', '#ff4d5e'],
      imoveis_fim: ['FIM', '#4bb7ff'], faliu: ['FALIU', '#ff4d5e'],
    };
    const lbLista = (remoto || Fluxo.placar.ler(board)).map((p, i) => {
      const [rotulo, cor] = LB_ROTULOS[p.resultado] || [String(p.resultado || '?').toUpperCase(), '#8fa1b2'];
      const venceu = Fluxo.placar.vitoria(p.resultado);
      let det = p.meses + 'm';
      if (venceu && (board === 'aposentadoria' || board === 'imoveis')) det += ' · ' + fmtCompacto(p.pat || 0);
      else if (venceu) det += ' · ⏱' + fmtTempo((p.tempo || 0) * 1000);
      if (board === 'sandbox' && p.detalhe) det = fmtCompacto(Number(p.detalhe)) + ' → ' + det;
      if (board === 'imoveis' && p.detalhe) det = (p.detalhe === 'comprar' ? '🏠 ' : '📈 ') + det;
      if (p.dificuldade === 'hardcore') det += ' · HC';
      return {
        pos: '#' + (i + 1),
        nome: p.nome,
        status: rotulo,
        cor,
        detalhe: det,
        bg: (p.voce || (s.nick && p.nome === s.nick)) ? 'rgba(34,212,126,.08)' : 'transparent',
      };
    });
    if (!lbLista.length) lbLista.push({ pos: '—', nome: remoto ? 'seja o primeiro do mundo a pontuar aqui' : 'nenhuma partida registrada ainda', status: '', cor: '#3a4a5a', detalhe: '', bg: 'transparent' });
    const boardDef = Fluxo.config.modos.find(m => m.id === board) || Fluxo.config.cenarios.find(c => c.id === board);
    const lbTitulo = '▮ PLACAR ' + (remoto ? 'GLOBAL' : 'LOCAL') + ' · ' + (boardDef ? boardDef.nome : board.toUpperCase());
    const lbTituloCor = remoto ? '#22d47e' : '#6b7c8c';

    const modosLista = Fluxo.config.modos.map(m => {
      const selecionado = m.id === s.modo;
      return {
        id: m.id,
        nome: m.nome,
        descricao: m.descricao,
        tag: m.disponivel ? (selecionado ? '▸ SELECIONADO' : '') : 'EM BREVE',
        tagCor: m.disponivel ? '#22d47e' : '#3a4a5a',
        borda: selecionado ? '#22d47e' : '#1e2833',
        nomeCor: m.disponivel ? '#f2f7fb' : '#3a4a5a',
        descCor: m.disponivel ? '#8fa1b2' : '#3a4a5a',
        cursor: m.disponivel ? 'pointer' : 'default',
        escolher: m.disponivel ? () => this.escolherModo(m.id) : () => {},
      };
    });

    const capitaisLista = Fluxo.config.sandbox.capitais.map(v => {
      const sel = s.capitalInicial === v;
      return {
        rotulo: fmt(v),
        bg: sel ? 'rgba(34,212,126,.12)' : 'transparent',
        cor: sel ? '#22d47e' : '#6b7c8c',
        escolher: () => this.escolherCapital(v),
      };
    });

    const cenariosLista = Fluxo.config.cenarios.map(c => {
      const selecionado = c.id === s.cenario;
      return {
        nome: c.nome,
        descricao: c.descricao,
        tag: c.disponivel ? (selecionado ? '▸ SELECIONADO' : '') : 'EM BREVE',
        tagCor: c.disponivel ? '#22d47e' : '#3a4a5a',
        borda: selecionado ? '#22d47e' : '#1e2833',
        nomeCor: c.disponivel ? '#f2f7fb' : '#3a4a5a',
        descCor: c.disponivel ? '#8fa1b2' : '#3a4a5a',
        cursor: c.disponivel ? 'pointer' : 'default',
        escolher: c.disponivel ? () => this.escolherCenario(c.id) : () => {},
      };
    });

    const im = s.imoveis;
    const cfgI = Fluxo.config.imoveis;
    const comprando = im && im.escolha === 'comprar';
    const estrategiaConfig = {
      comprarBg: comprando ? 'rgba(75,183,255,.12)' : 'transparent',
      comprarCor: comprando ? '#4bb7ff' : '#6b7c8c',
      alugarBg: !comprando ? 'rgba(75,183,255,.12)' : 'transparent',
      alugarCor: !comprando ? '#4bb7ff' : '#6b7c8c',
      dica: im
        ? (comprando
          ? 'entrada ' + fmt(Math.round(cfgI.valorImovel * cfgI.entradaPct)) + ' + ' + im.prazo + ' parcelas de ' + fmt(im.parcela) + ' — o imóvel é seu e valoriza'
          : 'aluguel ' + fmt(im.aluguel) + '/mês — sobra mais no bolso; disciplina decide se rende mais que o tijolo')
        : '',
      escolherComprar: () => this.escolherEstrategia('comprar'),
      escolherAlugar: () => this.escolherEstrategia('alugar'),
    };

    const imovelCard = im ? (() => {
      const equityTijolo = im.valorImovel - Fluxo.regras.saldoDevedor(im);
      const tijoloLidera = equityTijolo >= im.carteiraAluguel;
      return {
        escolhaLabel: comprando ? 'COMPRANDO ' + im.pagas + '/' + im.prazo : 'ALUGANDO',
        mensalFmt: comprando
          ? (im.pagas < im.prazo ? '−' + fmt(im.parcela) + '/mês · parcela' : 'QUITADO ✓')
          : '−' + fmt(im.aluguel) + '/mês · aluguel',
        dica: comprando
          ? 'Seu dinheiro vira tijolo: o imóvel valoriza, mas a parcela aperta o caixa. A corrida abaixo compara com quem alugou e investiu a diferença em FIIs.'
          : 'Você paga aluguel e a diferença sobra no SEU caixa — invista com disciplina. A corrida abaixo assume que cada real da diferença foi pra FIIs.',
        varImovelFmt: (im.varImovelMes >= 0 ? '▲ +' : '▼ ') + (im.varImovelMes * 100).toFixed(1) + '% no mês',
        varImovelCor: im.varImovelMes >= 0 ? '#22d47e' : '#ff4d5e',
        tijoloTag: 'TIJOLO' + (comprando ? ' (VOCÊ)' : ' (FANTASMA)'),
        tijoloFmt: fmt(equityTijolo),
        tijoloCor: tijoloLidera ? '#22d47e' : '#8fa1b2',
        carteiraTag: 'ALUGAR+INVESTIR' + (comprando ? ' (FANTASMA)' : ' (SUA META)'),
        carteiraFmt: fmt(im.carteiraAluguel),
        carteiraCor: !tijoloLidera ? '#22d47e' : '#8fa1b2',
      };
    })() : null;

    const ap = s.aposentadoria;
    const saqueFixo = ap && ap.saqueModo === 'fixo';
    const saqueConfig = {
      fixoBg: saqueFixo ? 'rgba(34,212,126,.12)' : 'transparent',
      fixoCor: saqueFixo ? '#22d47e' : '#6b7c8c',
      pctBg: !saqueFixo ? 'rgba(34,212,126,.12)' : 'transparent',
      pctCor: !saqueFixo ? '#22d47e' : '#6b7c8c',
      dica: saqueFixo
        ? 'saque fixo = seu custo de vida (inflaciona). É o que cria o risco de sequência.'
        : 'saque de ' + (ap ? (ap.taxaSaque * 100).toFixed(0) : '4') + '% do patrimônio/mês — se ajusta sozinho e quase nunca zera.',
      escolherFixo: () => this.escolherSaqueModo('fixo'),
      escolherPct: () => this.escolherSaqueModo('percentual'),
    };

    const negocioCard = s.negocio ? (() => {
      const n = s.negocio;
      const cfgE = Fluxo.config.empresario;
      const vermelho = n.caixa < 0;
      return {
        falido: n.falido,
        operando: !n.falido,
        statusLabel: n.falido ? 'FALIDO' : vermelho ? 'VERMELHO ' + n.mesesNoVermelho + '/' + cfgE.mesesFalencia : 'OPERANDO',
        statusCor: n.falido ? '#ff4d5e' : vermelho ? '#ff9d4b' : '#22d47e',
        caixaFmt: fmt(n.caixa),
        caixaCor: vermelho ? '#ff4d5e' : '#f2f7fb',
        receitaFmt: n.receitaMes == null ? '—' : '+' + fmt(n.receitaMes) + ' no mês',
        receitaCor: n.receitaMes == null ? '#3a4a5a' : n.varReceitaMes >= 0 ? '#22d47e' : '#ff9d4b',
        receitaBaseFmt: fmt(n.receitaBase),
        custoFixoFmt: fmt(n.custoFixo),
        dica: 'A empresa tem caixa próprio: reinvestir cresce a receita (com retorno decrescente), sacar leva o lucro pro seu bolso. Não deixe o giro secar.',
        reinvestirLabel: 'REINVESTIR ' + fmt(cfgE.reinvestimentoPasso) + ' ▸ +' + fmt(Fluxo.regras.ganhoReinvestimento(n.nivel)) + '/MÊS',
        reinvestir: this.reinvestirNegocio,
        sacar500: () => this.sacarNegocio(500),
        sacar1k: () => this.sacarNegocio(1000),
        sacar2k: () => this.sacarNegocio(2000),
        sacarMax: () => this.sacarNegocio(s.negocio.caixa),
        aportar500: () => this.aportarNegocio(500),
        aportar1k: () => this.aportarNegocio(1000),
        aportar2k: () => this.aportarNegocio(2000),
      };
    })() : null;

    const termosIds = Object.keys(Fluxo.conceitos.termos);
    const desbloqueados = Fluxo.conceitos.termosDesbloqueados();
    const glossarioLista = termosIds.map(id => {
      const desb = desbloqueados.includes(id);
      const t = Fluxo.conceitos.termos[id];
      return {
        icone: desb ? '📖' : '🔒',
        nome: desb ? t.nome : '???',
        definicao: desb ? t.definicao : 'Continue jogando: este conceito aparece quando a decisão certa (ou errada) acontecer.',
        nomeCor: desb ? '#f2f7fb' : '#3a4a5a',
        defCor: desb ? '#8fa1b2' : '#3a4a5a',
      };
    });
    const glossarioContador = desbloqueados.length + '/' + termosIds.length + ' termos desbloqueados';

    const modalConceito = s.modal ? (() => {
      const c = Fluxo.conceitos.tooltips[s.modal.id];
      return {
        titulo: c.titulo,
        explicacao: c.explicacao,
        termosFmt: (c.termos || []).map(t => Fluxo.conceitos.termos[t].nome).join(' · '),
        confirmarLabel: s.modal.temAcao ? 'ENTENDI, CONFIRMAR ▸' : 'ENTENDI ▸',
        mostraCancelar: !!s.modal.temAcao,
        confirmar: this.confirmarModal,
        cancelar: this.cancelarModal,
      };
    })() : null;

    const modoDef = Fluxo.config.modos.find(m => m.id === s.modo);
    const ehSandbox = s.modo === 'sandbox';
    const ehCenarios = s.modo === 'cenarios';
    const normalSel = s.dificuldade === 'normal';

    // Fase do cenário aposentadoria define rótulos, barra de progresso e badge.
    const emSaque = !!(ap && ap.fase === 'saque');
    let progLabel, progVal, salarioLabel, salarioStatus, salarioCor, modoTag;
    if (ap) {
      if (emSaque) {
        progLabel = 'SOBREVIVÊNCIA — meses de saque aguentados';
        progVal = Math.min(100, (ap.saquesFeitos / ap.turnosSaque) * 100);
        salarioLabel = 'SAQUE / MÊS';
        salarioStatus = '−' + fmt(ap.saqueMes);
        salarioCor = '#ff9d4b';
        modoTag = 'SAQUE ' + ap.saquesFeitos + '/' + ap.turnosSaque;
      } else {
        progLabel = 'ACUMULAÇÃO — meses até aposentar';
        progVal = Math.min(100, (s.mes / ap.turnosAcumulacao) * 100);
        salarioLabel = 'SALÁRIO / MÊS';
        salarioStatus = '+' + fmt(s.salario);
        salarioCor = '#8fd47e';
        modoTag = 'ACUMULAÇÃO ' + s.mes + '/' + ap.turnosAcumulacao;
      }
    } else if (im) {
      progLabel = 'CENÁRIO IMÓVEIS — meses do financiamento';
      progVal = Math.min(100, (s.mes / im.prazo) * 100);
      salarioLabel = 'SALÁRIO / MÊS';
      salarioStatus = s.semSalario > 0 ? 'DESEMPREGADO' : '+' + fmt(s.salario);
      salarioCor = s.semSalario > 0 ? '#ff4d5e' : '#8fd47e';
      modoTag = comprando ? 'IMÓVEIS · COMPRANDO' : 'IMÓVEIS · ALUGANDO';
    } else {
      progLabel = 'RUMO À INDEPENDÊNCIA — renda passiva vs. custo de vida';
      progVal = prog;
      salarioLabel = s.negocio ? 'LUCRO MÉDIO DO NEGÓCIO' : 'SALÁRIO / MÊS';
      salarioStatus = s.negocio
        ? (s.negocio.falido ? 'SEM RENDA' : '+' + fmt(s.negocio.receitaBase - s.negocio.custoFixo))
        : (s.semSalario > 0 ? 'DESEMPREGADO' : '+' + fmt(s.salario));
      salarioCor = s.negocio
        ? (s.negocio.falido ? '#ff4d5e' : '#8fd47e')
        : (s.semSalario > 0 ? '#ff4d5e' : '#8fd47e');
      modoTag = s.modo === 'classico' ? '' : (modoDef ? modoDef.nome : s.modo.toUpperCase());
    }
    const progCor = progVal >= 100 ? '#22d47e' : progVal >= 50 ? '#8fd47e' : progVal >= 20 ? '#ffc24b' : '#ff9d4b';

    // Tela de fim: 5 desfechos possíveis (livre/faliu do clássico + 2 da aposentadoria).
    let fimTitulo, fimCor, fimResumo, fimLicao;
    if (s.fim === 'apos_sucesso') {
      fimTitulo = 'APOSENTADORIA OK'; fimCor = '#22d47e';
      fimResumo = 'Seu patrimônio sustentou todos os ' + (ap ? ap.turnosSaque : '') + ' meses de saque sem zerar.';
      fimLicao = 'Lição: acumular o suficiente e diversificar amortece o "risco de sequência de retornos" — uma sequência de anos ruins logo no início da aposentadoria é o que mais quebra quem para de trabalhar.';
    } else if (s.fim === 'apos_faliu') {
      fimTitulo = 'ACABOU'; fimCor = '#ff4d5e';
      fimResumo = 'Seu patrimônio durou ' + (ap ? ap.saquesFeitos : 0) + ' de ' + (ap ? ap.turnosSaque : '') + ' meses de saque antes de zerar.';
      fimLicao = 'Lição: mesma média de retorno, ordem diferente = resultado diferente. Anos ruins no começo forçam vender na baixa e derrubam tudo. Sacar menos e ter reserva protege os primeiros anos — é o risco de sequência de retornos.';
    } else if (s.fim === 'imoveis_fim') {
      const tijolo = im.valorImovel; // quitado ao fim do prazo
      const carteira = im.carteiraAluguel;
      const tijoloVenceu = tijolo >= carteira;
      fimTitulo = tijoloVenceu ? 'TIJOLO VENCEU' : 'ALUGUEL VENCEU';
      fimCor = (tijoloVenceu === comprando) ? '#22d47e' : '#ffc24b';
      fimResumo = '🏠 COMPRAR: imóvel quitado valendo ' + fmt(tijolo) + '  ·  📈 ALUGAR+INVESTIR: carteira em ' + fmt(carteira) + '. Você escolheu ' + (comprando ? 'COMPRAR' : 'ALUGAR') + ' e fechou com patrimônio total de ' + fmt(pat) + '.';
      fimLicao = 'Lição: custo de oportunidade — cada real na entrada e nas parcelas é um real que não compôs juros na carteira (e vice-versa). Não há resposta universal: juros do financiamento, valorização do imóvel e disciplina de investir a diferença decidem a corrida.';
    } else if (s.fim === 'faliu') {
      fimTitulo = 'FALIU'; fimCor = '#ff4d5e';
      fimResumo = 'Você sobreviveu ' + s.mes + ' meses antes de as contas engolirem tudo.';
      fimLicao = 'Lição: reserva de emergência primeiro, sempre. Concentração + azar = falência. Diversificar não é sobre ganhar mais, é sobre nunca quebrar.';
    } else {
      fimTitulo = 'LIVRE'; fimCor = '#22d47e';
      fimResumo = 'Em ' + s.mes + ' meses sua renda passiva (' + fmt(rp) + ') superou seu custo de vida (' + fmt(s.custo) + ').';
      fimLicao = 'Lição: quem venceu não acertou o timing do mercado — construiu renda passiva mês a mês e deixou os juros compostos trabalharem.';
    }
    return {
      mostraIntro: s.tela === 'intro',
      modosLista,
      ehSandbox,
      modoTag,
      mostraCapitais: ehSandbox,
      capitaisLista,
      mostraCenarios: ehCenarios,
      cenariosLista,
      mostraSaqueConfig: !!ap,
      fixoBg: saqueConfig.fixoBg, fixoCor: saqueConfig.fixoCor,
      pctBg: saqueConfig.pctBg, pctCor: saqueConfig.pctCor,
      saqueDica: saqueConfig.dica,
      escolherSaqueFixo: saqueConfig.escolherFixo,
      escolherSaquePct: saqueConfig.escolherPct,
      mostraEstrategia: !!im,
      comprarBg: estrategiaConfig.comprarBg, comprarCor: estrategiaConfig.comprarCor,
      alugarBg: estrategiaConfig.alugarBg, alugarCor: estrategiaConfig.alugarCor,
      estrategiaDica: estrategiaConfig.dica,
      escolherComprar: estrategiaConfig.escolherComprar,
      escolherAlugar: estrategiaConfig.escolherAlugar,
      mostraImovel: !!im,
      imovelCard,
      mostraNegocio: !!s.negocio,
      negocioCard,
      mostraModal: !!s.modal,
      modalConceito,
      mostraGlossario: !!s.glossarioAberto,
      glossarioLista,
      glossarioContador,
      toggleGlossario: this.toggleGlossario,
      rendaResumo: ap
        ? 'acumula ' + ap.turnosAcumulacao + ' meses, depois saca por ' + ap.turnosSaque + ' meses'
        : im
          ? (comprando
            ? 'parcela ' + fmt(im.parcela) + '/mês por ' + im.prazo + ' meses'
            : 'aluguel ' + fmt(im.aluguel) + '/mês · diferença sobra pra investir')
          : s.negocio
            ? 'negócio: giro ' + fmt(s.negocio.caixa) + ' · receita ~' + fmt(s.negocio.receitaBase) + ' − custos ' + fmt(s.negocio.custoFixo) + '/mês'
            : 'salário ' + fmt(s.salario) + '/mês',
      salarioLabel,
      progLabel,
      normalBg: normalSel ? 'rgba(34,212,126,.12)' : 'transparent',
      normalCor: normalSel ? '#22d47e' : '#6b7c8c',
      hardBg: normalSel ? 'transparent' : 'rgba(255,77,94,.12)',
      hardCor: normalSel ? '#6b7c8c' : '#ff4d5e',
      difDica: normalSel
        ? 'mais folga no caixa e menos acidentes — bom pra aprender as mecânicas'
        : 'caixa inicial menor, custo de vida mais pesado e mais acidentes no caminho',
      escolherNormal: () => this.escolherDificuldade('normal'),
      escolherHardcore: () => this.escolherDificuldade('hardcore'),
      voltarMenu: this.voltarMenu,
      mostraJogo: s.tela === 'jogo',
      mostraFim: !!s.fim,
      mesFmt: String(s.mes).padStart(2, '0'),
      caixaFmt: fmt(s.caixa),
      caixaCor: s.caixa < s.custo ? '#ff4d5e' : '#f2f7fb',
      salarioFmt: fmt(s.salario),
      salarioStatus,
      salarioCor,
      custoFmt: fmt(s.custo),
      rpFmt: fmt(rp),
      patrimonioFmt: fmt(pat),
      progPct: progVal.toFixed(1),
      progFmt: progVal.toFixed(1) + '%',
      progCor,
      sparkPoints: spark.points,
      sparkCor: spark.positivo ? '#22d47e' : '#ff4d5e',
      ativosLista,
      logLista: s.log,
      lbLista, lbTitulo, lbTituloCor,
      nick: s.nick,
      setNick: this.setNick,
      nickDica: Fluxo.placar.online()
        ? 'seu nome no ranking mundial — todos os modos têm placar global'
        : 'placar global desligado — recordes ficam salvos só neste dispositivo',
      fimTitulo, fimCor, fimResumo, fimLicao,
      tempoFmt: s.inicioTs ? fmtTempo((s.fimTs || s.agora || Date.now()) - s.inicioTs) : '00:00',
      tempoCor: s.auto ? '#ffc24b' : '#f2f7fb',
      autoLabel: s.auto ? '⏸ AUTO: ON' : '▶ AUTO: OFF',
      autoBg: s.auto ? 'rgba(255,194,75,.1)' : 'transparent',
      autoCor: s.auto ? '#ffc24b' : '#6b7c8c',
      toggleAuto: this.toggleAuto,
      comecar: this.comecar,
      reiniciar: this.reiniciar,
      fecharMes: this.fecharMes,
    };
  }
}
</script>
</body>
</html>
