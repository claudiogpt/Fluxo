<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tema.css">
<script src="./support.js"></script>
</head>
<body>
<!-- Card da moradia (cenário imóveis): sua estratégia + a corrida contra o fantasma.
     Props: escolhaLabel, mensalFmt, dica, varImovelFmt, varImovelCor,
     tijoloTag, tijoloFmt, tijoloCor, carteiraTag, carteiraFmt, carteiraCor. -->
<x-dc>
<div style="background:#0a1420;border:1px solid #1e3a52;border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;color:#d7e1ea;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;">
  <div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
      <span style="font-weight:700;color:#4bb7ff;letter-spacing:.5px;">MORADIA</span>
      <span style="font-size:10px;letter-spacing:1px;color:#4bb7ff;border:1px solid #4bb7ff;border-radius:3px;padding:1px 6px;">{{ escolhaLabel }}</span>
      <span style="color:#8fa1b2;font-size:11px;">{{ mensalFmt }}</span>
    </div>
    <div style="color:#6b7c8c;font-size:11px;margin-top:2px;max-width:460px;">{{ dica }}</div>
  </div>
  <div style="text-align:right;">
    <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">IMÓVEL</div>
    <div style="font-size:11px;font-weight:600;color:{{ varImovelCor }};">{{ varImovelFmt }}</div>
  </div>
  <div style="grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid #142638;padding-top:9px;">
    <div>
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">🏠 {{ tijoloTag }}</div>
      <div style="font-size:16px;font-weight:700;color:{{ tijoloCor }};">{{ tijoloFmt }}</div>
    </div>
    <div style="text-align:right;">
      <div style="color:#6b7c8c;font-size:10px;letter-spacing:1px;">📈 {{ carteiraTag }}</div>
      <div style="font-size:16px;font-weight:700;color:{{ carteiraCor }};">{{ carteiraFmt }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"escolhaLabel":{"default":"COMPRANDO 12/48"},"mensalFmt":{"default":"−R$ 2.528/mês · parcela"},"dica":{"default":"Seu dinheiro vira tijolo: o imóvel valoriza, mas a parcela aperta o caixa. A corrida abaixo compara com quem alugou e investiu a diferença."},"varImovelFmt":{"default":"▲ +1.5% no mês"},"varImovelCor":{"default":"#22d47e"},"tijoloTag":{"default":"TIJOLO (VOCÊ)"},"tijoloFmt":{"default":"R$ 38.400"},"tijoloCor":{"default":"#22d47e"},"carteiraTag":{"default":"ALUGAR+INVESTIR (FANTASMA)"},"carteiraFmt":{"default":"R$ 36.900"},"carteiraCor":{"default":"#8fa1b2"}}'></script>
</body>
</html>
