<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./tema.css">
<script src="./support.js"></script>
</head>
<body>
<!-- Card de um ativo com botões de aporte/resgate. Só template.
     Props: nome, ticker, riscoLabel, riscoCor, dica, valorFmt, varFmt, varCor
     e os callbacks mais500/mais1k/mais2k/tudo/menos500/menos1k/menos2k/zerar. -->
<x-dc>
<div style="background:#11161d;border:1px solid #1e2833;border-radius:6px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;color:#d7e1ea;font-family:'IBM Plex Mono',monospace;font-size:13px;line-height:1.5;">
  <div>
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;">
      <span style="font-weight:700;color:#f2f7fb;letter-spacing:.5px;">{{ nome }}</span>
      <span style="color:#3a4a5a;font-size:11px;">{{ ticker }}</span>
      <span style="font-size:10px;letter-spacing:1px;color:{{ riscoCor }};border:1px solid {{ riscoCor }};border-radius:3px;padding:1px 6px;">{{ riscoLabel }}</span>
    </div>
    <div style="color:#6b7c8c;font-size:11px;margin-top:2px;max-width:460px;">{{ dica }}</div>
  </div>
  <div style="text-align:right;">
    <div style="font-size:17px;font-weight:700;color:#f2f7fb;">{{ valorFmt }}</div>
    <div style="font-size:11px;font-weight:600;color:{{ varCor }};">{{ varFmt }}</div>
  </div>
  <div style="grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid #1a222c;padding-top:9px;">
    <span style="color:#3a4a5a;font-size:10px;letter-spacing:1px;">APORTE</span>
    <button onClick="{{ mais500 }}" style="background:#0e1a14;border:1px solid #1e4a34;color:#22d47e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#123322;">+500</button>
    <button onClick="{{ mais1k }}" style="background:#0e1a14;border:1px solid #1e4a34;color:#22d47e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#123322;">+1.000</button>
    <button onClick="{{ mais2k }}" style="background:#0e1a14;border:1px solid #1e4a34;color:#22d47e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#123322;">+2.000</button>
    <button onClick="{{ tudo }}" style="background:#0e1a14;border:1px solid #1e4a34;color:#22d47e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#123322;">MAX</button>
    <span style="color:#3a4a5a;font-size:10px;letter-spacing:1px;margin-left:10px;">RESGATE</span>
    <button onClick="{{ menos500 }}" style="background:#1a1114;border:1px solid #4a1e28;color:#ff4d5e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#2a161c;">−500</button>
    <button onClick="{{ menos1k }}" style="background:#1a1114;border:1px solid #4a1e28;color:#ff4d5e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#2a161c;">−1.000</button>
    <button onClick="{{ menos2k }}" style="background:#1a1114;border:1px solid #4a1e28;color:#ff4d5e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#2a161c;">−2.000</button>
    <button onClick="{{ zerar }}" style="background:#1a1114;border:1px solid #4a1e28;color:#ff4d5e;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:5px 10px;border-radius:3px;cursor:pointer;" style-hover="background:#2a161c;">ZERAR</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"nome":{"default":"AÇÕES"},"ticker":{"default":"IBOV"},"riscoLabel":{"default":"ALTO"},"riscoCor":{"default":"#ff9d4b"},"dica":{"default":"Maior potencial de crescimento, quedas de 30% acontecem. Dividendos moderados."},"valorFmt":{"default":"R$ 12.480"},"varFmt":{"default":"▲ +2.2% no mês"},"varCor":{"default":"#22d47e"}}'></script>
</body>
</html>
